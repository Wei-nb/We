name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS and clean for deploy
        run: |
          git lfs pull
          echo "=== Video sizes ==="
          ls -lh assets/works/daomadan/hero-video.mp4 assets/works/anim-1/video.mp4 assets/works/cyberpunk-city/hero-video.mp4 2>/dev/null || true
          # Remove git tracking so Pages artifact is clean files
          rm -f .gitattributes .gitmodules
          rm -rf .git

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
