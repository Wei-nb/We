name: Deploy Pages (LFS)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: |
          git lfs pull
          git lfs ls-files -l | head -20
          echo "--- Checking video files ---"
          ls -lh assets/works/daomadan/hero-video.mp4 assets/works/anim-1/video.mp4 assets/works/cyberpunk-city/hero-video.mp4 2>/dev/null || echo "Some videos missing"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
