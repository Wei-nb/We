name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files and prepare deploy
        run: |
          git lfs pull
          echo "=== LFS files ==="
          git lfs ls-files -s
          echo "=== Video sizes (must be MB, not bytes) ==="
          ls -lh assets/works/daomadan/hero-video.mp4 assets/works/anim-1/video.mp4 assets/works/cyberpunk-city/hero-video.mp4 2>/dev/null || true
          echo "=== Removing .gitattributes so videos are pushed as real files ==="
          rm -f .gitattributes

      - name: Deploy to gh-pages
        run: |
          # Remove .gitattributes so LFS rules don't interfere
          rm -f .gitattributes
          
          # Remove existing git (which has LFS tracking)
          rm -rf .git
          
          # Start fresh git repo - videos are now real files, no LFS
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy"
          
          echo "=== Video files in commit ==="
          git ls-tree -r HEAD --long | grep -E '\.mp4$' | head -20
          
          git push --force origin HEAD:gh-pages
